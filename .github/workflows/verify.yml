name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run acceptance harness
        # 全程跑在 mkdtemp 的临时 <config> 下（XDG_CONFIG_HOME），不读不写任何真实配置，
        # 因此不需要任何 secret。
        run: node tools/verify.mjs
